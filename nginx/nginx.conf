# ==============================================================================
# GATEWAY SOFTWARE SOLUTIONS (GSS) MANAGEMENT SYSTEM
# High-Concurrency Production NGINX Core Configuration
# Optimized for 10,000+ Concurrent Connections & Low-Latency Throughput
# ==============================================================================

user  nginx;
# Auto-tune worker processes based on available CPU cores
worker_processes  auto;

# Maximum number of open files per worker process (prevents "too many open files")
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Maximum concurrent connections per worker (4 cores * 10240 = 40,960 connections)
    worker_connections  10240;
    # Accept as many connections as possible after notification
    multi_accept        on;
    # Efficient I/O multiplexing mechanism for Linux
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance logging format with upstream response time & cache status
    log_format  gms_perf  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'upstream_addr="$upstream_addr" '
                          'upstream_status="$upstream_status" '
                          'upstream_response_time="$upstream_response_time" '
                          'cache_status="$upstream_cache_status"';

    access_log  /var/log/nginx/access.log  gms_perf buffer=64k flush=5s;

    # High-Performance Kernel Sockets Tuning
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  10000;
    types_hash_max_size 2048;
    server_tokens       off;

    # Buffer & Request Sizing (Mitigate Slowloris & Buffer Overflow)
    client_body_buffer_size      128k;
    client_max_body_size         50m;
    client_header_buffer_size    4k;
    large_client_header_buffers  4 32k;

    # Timeouts to free stale sockets quickly
    client_body_timeout          12;
    client_header_timeout        12;
    send_timeout                 10;

    # Dynamic Gzip Compression (Reduces payload size by ~70%)
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/truetype
        font/opentype
        image/svg+xml;

    # Include modular virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
