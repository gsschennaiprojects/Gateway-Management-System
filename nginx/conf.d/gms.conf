# ==============================================================================
# GSS MANAGEMENT SYSTEM — UPSTREAM CLUSTER & LOAD BALANCING
# Least-Connection Load Balancing, Micro-Caching & High-Throughput Proxy
# ==============================================================================

# Micro-cache storage zone: 50MB shared key zone (~400,000 keys), max 1GB disk cache
proxy_cache_path /var/cache/nginx/gms_cache 
    levels=1:2 
    keys_zone=GMS_MICRO:50m 
    inactive=10m 
    max_size=1g 
    use_temp_path=off;

# Rate limiting zones: 100 requests/sec with burst buffer of 200
limit_req_zone $binary_remote_addr zone=gms_api_limit:20m rate=100r/s;
limit_req_zone $binary_remote_addr zone=gms_auth_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gms_conn_limit:10m;

# ─── Upstream Backend Cluster ──────────────────────────────────────────────────
upstream gms_backend_cluster {
    # Distribute traffic to the server with least active connections
    least_conn;

    # Keepalive connection pool (re-uses existing TCP sockets to Node.js workers)
    keepalive 64;

    # Next.js Application Worker Nodes (Clustered instances)
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
}

# ─── HTTP -> HTTPS Redirect Server ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name portal.gatewayskill.in localhost;

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all plain HTTP traffic to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Primary HTTPS Reverse Proxy & Load Balancer ──────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.gatewayskill.in localhost;

    # SSL Termination & Cryptography Tuning
    ssl_certificate           /etc/ssl/certs/gms-portal.crt;
    ssl_certificate_key       /etc/ssl/private/gms-portal.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling for faster TLS handshakes
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # Strict Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Concurrency limit per client IP (prevents connection starvation)
    limit_conn gms_conn_limit 50;

    # ─── 1. Static Assets — Immutable 1-Year Cache (Bypasses Upstream) ─────────
    location /_next/static/ {
        proxy_pass http://gms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://gms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ─── 2. Health & Cluster Status (Zero Cache, Direct Upstream) ───────────────
    location = /api/health {
        proxy_pass http://gms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ─── 3. Auth API — Strict Rate-Limiting (Brute-Force Shield) ────────────────
    location /api/auth/ {
        limit_req zone=gms_auth_limit burst=10 nodelay;

        proxy_pass http://gms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ─── 4. Dynamic API Endpoints — 2s Micro-Cache (Absorbs 10,000 Stampedes) ──
    location /api/ {
        limit_req zone=gms_api_limit burst=200 nodelay;

        # Micro-caching configuration for GET requests
        proxy_cache GMS_MICRO;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";
        proxy_cache_valid 200 302 2s;
        proxy_cache_valid 404 10s;
        
        # Stale-While-Revalidate on NGINX layer: serve stale if upstream is busy
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://gms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy buffer optimization for JSON payloads
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 256k;
    }

    # ─── 5. General Webapp & Dashboard Routes ──────────────────────────────────
    location / {
        proxy_pass http://gms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
