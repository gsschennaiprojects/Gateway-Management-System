# ==============================================================================
# GATEWAY SOFTWARE SOLUTIONS (GSS) MANAGEMENT SYSTEM
# High-Availability Clustered Docker Compose Configuration
# Supports 10,000+ Concurrent Users via Scaled Backend Replicas & NGINX LB
# ==============================================================================

version: '3.8'

services:
  # Next.js Clustered Application Workers
  gms-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gms-portal:latest
    restart: always
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gms_internal

  # High-Concurrency NGINX Load Balancer & Reverse Proxy
  gms-nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx/gms_cache
      - nginx_logs:/var/log/nginx
    depends_on:
      gms-web:
        condition: service_healthy
    networks:
      - gms_internal

networks:
  gms_internal:
    driver: bridge

volumes:
  nginx_cache:
  nginx_logs:
